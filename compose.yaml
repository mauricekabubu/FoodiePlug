services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./foodplanner/.env
        required: false
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost:8080}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      SQLITE_DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    expose:
      - "8000"
    volumes:
      - app_data:/data
      - static_files:/app/staticfiles
      - ./foodplanner/db.sqlite3:/seed/db.sqlite3:ro
      - ./foodplanner/media:/seed/media:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/robots.txt', timeout=4)"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/srv/static:ro
      - app_data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
  static_files:
